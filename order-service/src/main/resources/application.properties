spring.application.name=orderservice
server.port=9094
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ordersdb
spring.datasource.username=root
spring.datasource.password=JavaRadius@123
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true


# Kafka broker address
  #spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.bootstrap-servers=172.17.154.85:9092

# (Optional) Producer key/value serialization
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
#feign.circuitbreaker.enabled=true
#spring.cloud.openfeign.circuitbreaker.enabled=true
logging.level.io.github.resilience4j=DEBUG

# Expose endpoints we want
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

resilience4j.circuitbreaker.instances.product_service.register-health-indicator=true
resilience4j.circuitbreaker.instances.product_service.slidingWindowSize=5
resilience4j.circuitbreaker.instances.product_service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.product_service.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.product_service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.product_service.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.product_service.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.product_service.permittedNumberOfCallsInHalfOpenState=3

# Retry Configuration
resilience4j.retry.instances.product_service.max-attempts=3
resilience4j.retry.instances.product_service.wait-duration=2s
resilience4j.retry.instances.product_service.enable-exponential-backoff=true
resilience4j.retry.instances.product_service.exponential-backoff-multiplier=2


# Distributed Tracing
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans
management.tracing.sampling.probability=1.0










